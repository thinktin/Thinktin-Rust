# Android App（WBS 13.x）：绑定一致性、单元测试（含 Robolectric 界面测试和经 JNA 真调 Rust 的冒烟测试）、lint、debug 包。
#
# 有意不在这里交叉编译三个 ABI 的 .so（NDK + cargo-ndk 一次要几十分钟，每个 PR 都跑不划算）：
# 这里上传的 app-cn-debug.apk 不含 client-core 的 .so，只能用演示模式（关掉会显示“无法加载核心库”页）。
# 绑定和 Rust 是否一致由 `sync-core.sh --check` 把关，绑定和库能否真正对上由 CoreSmokeTest 经 JNA 调本机 .so 把关。
# 带 .so 的完整包：手动跑 mobile.yml 的 android job（产出 target/android），下载后
# 解压成 `<目录>/thinktin-core/`，`apps/android/scripts/sync-core.sh --from <目录>` 再 assembleDebug；本地见 apps/android/README.md。
name: Android

on:
  push:
    branches: [android-app, main]
    paths:
      - "apps/android/**"
      - "crates/client-core/**"
      - "crates/proto/**"
      - "tools/client-core/**"
      # 依赖版本（如 uniffi）由 Cargo.lock 决定：只改锁文件也可能改变生成的绑定。
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/client-core/**"
      - "crates/proto/**"
      - "tools/client-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4

      # 提交的 Kotlin 绑定必须和 crates/client-core 生成的一致（顺带编出本机的 libclient_core.so 给冒烟测试用）。
      - name: 绑定一致
        run: apps/android/scripts/sync-core.sh --check

      # lint 的 abortOnError 开着，不用 baseline。CoreSmokeTest 经 JNA 调 target/debug 里的 libclient_core.so；
      # THINKTIN_REQUIRE_CORE=1：拿不到库目录时冒烟测试失败而不是跳过（同 ci.yml 的 THINKTIN_REQUIRE_DB）。
      # :app:assembleCnRelease 跑一遍 R8（打包本身不检查只经 JNI 用到的类，见下一步）。
      - name: Test, lint, assemble
        working-directory: apps/android
        env:
          THINKTIN_CORE_LIB_DIR: ${{ github.workspace }}/target/debug
          THINKTIN_REQUIRE_CORE: "1"
        run: ./gradlew --no-daemon test lint assembleDebug :app:assembleCnRelease

      # R8 删掉没有引用的类只会悄悄删，构建照样成功：org.rustls.platformverifier.** 只有 Rust 经 JNI 调，
      # TlsInit 只靠 core/consumer-rules.pro 的 -keep 保住。解开 release 包，确认这些类还在 dex 里。
      - name: Release dex keeps JNI classes
        working-directory: apps/android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/cn/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::没有找到 release apk"; exit 1; fi
          dex_dir=$(mktemp -d)
          unzip -q -o "$apk" 'classes*.dex' -d "$dex_dir"
          for cls in 'Lorg/rustls/platformverifier/CertificateVerifier;' 'Lcn/thinktin/core/TlsInit;'; do
            if ! grep -q -a -F "$cls" "$dex_dir"/classes*.dex; then
              echo "::error::$apk 的 dex 里没有 $cls（R8 删掉了，检查 core/consumer-rules.pro）"
              exit 1
            fi
          done
          echo "$apk：JNI 用到的类都在"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/*/build/reports/
            apps/android/*/build/test-results/
          if-no-files-found: ignore

      # 不含 .so 的演示包（见文件开头的说明）。
      - uses: actions/upload-artifact@v4
        with:
          name: app-cn-debug.apk
          path: apps/android/app/build/outputs/apk/cn/debug/app-cn-debug.apk
          if-no-files-found: error
