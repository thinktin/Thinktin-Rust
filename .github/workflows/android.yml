# Android App（WBS 13.x）：绑定一致性、单元测试（含 Robolectric 界面测试）、lint、debug 包。
# 这里打的 APK 不含 client-core 的 .so（只能用演示模式）；带 .so 的完整包见 mobile.yml + apps/android/scripts/sync-core.sh。
name: Android

on:
  push:
    branches: [android-app, main]
    paths:
      - "apps/android/**"
      - "crates/client-core/**"
      - "crates/proto/**"
      - "tools/client-core/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/client-core/**"
      - "crates/proto/**"
      - "tools/client-core/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4

      # 提交的 Kotlin 绑定必须和 crates/client-core 生成的一致（顺带编出本机的 libclient_core.so 给冒烟测试用）。
      - name: 绑定一致
        run: apps/android/scripts/sync-core.sh --check

      # lint 的 abortOnError 开着，不用 baseline。CoreSmokeTest 经 JNA 调 target/debug 里的 libclient_core.so。
      - name: Test, lint, assemble
        working-directory: apps/android
        run: THINKTIN_CORE_LIB_DIR=$GITHUB_WORKSPACE/target/debug ./gradlew --no-daemon test lint assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/*/build/reports/
            apps/android/*/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-cn-debug.apk
          path: apps/android/app/build/outputs/apk/cn/debug/app-cn-debug.apk
          if-no-files-found: error
