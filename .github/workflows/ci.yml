# 后端 CI（WBS 2.1）：格式、lint、全部测试（含 Postgres 上的集成测试和端到端测试）、客户端核心的绑定冒烟。
name: CI

on:
  push:
    branches: [main, backend-core]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thinktin_dev
          POSTGRES_PASSWORD: thinktin_dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://thinktin_dev:thinktin_dev@127.0.0.1:5432/postgres
      # 没有数据库时测试是跳过而不是失败；CI 里必须真的跑。
      THINKTIN_REQUIRE_DB: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          # 迁移检查要对照最近的发布标签。
          fetch-depth: 0
      # 发布过的迁移不许改，会让上一版程序出错的改动要标明（WBS 2.9，docs/release.md 第 3 节）。
      - name: Migrations
        run: |
          python3 tools/ci/check_migrations.py --self-test
          python3 tools/ci/check_migrations.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # 编译错误、clippy 报错和失败的测试同时写成注解（tools/ci/annotate.py），
      # 在 PR 页面和检查结果的接口里直接能看到，不用翻日志。
      - name: Lint
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=json -- -D warnings \
            | python3 tools/ci/annotate.py cargo
      # 发布镜像用 --locked 构建：Cargo.lock 要和 Cargo.toml 对得上。
      - name: Cargo.lock is up to date
        run: |
          git diff --exit-code -- Cargo.lock > "$RUNNER_TEMP/lock.diff" \
            || { python3 tools/ci/annotate.py lockfile < "$RUNNER_TEMP/lock.diff"; exit 1; }
      # 第三方许可证（WBS 16.5，docs/licenses.md）：发出去的每个 Rust 程序依赖的 crate 都按
      # tools/licenses/policy.toml 检查，问题写成注解。模板镜像里的 npm、Python 包在 templates.yml 里查。
      - name: Licenses
        run: |
          python3 tools/licenses/licenses.py self-test
          tools/licenses/rust.sh "$RUNNER_TEMP/licenses"
      - name: Test
        id: test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Annotate test failures
        if: failure() && steps.test.outcome == 'failure'
        run: python3 tools/ci/annotate.py tests < "$RUNNER_TEMP/test.log"
      - name: client-core bindings smoke test
        run: tools/client-core/ffi-smoke.sh
