# 在 Codemagic 的 Mac 上跑 codemagic.yaml 里的检查（apple-check：模拟器上 build + test、编 macOS App；ios-screenshots：
# 演示数据的截图；apple-package：全部 Apple 目标的 ThinktinCore），结果和截图拿回 GitHub。GitHub 的 macOS 机器排不上时用。
#
# 两种触发：
#   - 把要检查的提交推到 codemagic/<工作流> 分支，比如 git push -f origin HEAD:codemagic/ios-screenshots
#     （Codemagic 构建的就是这个分支，所以推之前不用合并；这个文件要在推上去的提交里）；
#   - 手动触发（这个文件要先在默认分支上）：选分支和工作流。
# Codemagic 的 API 令牌在 Test flight 环境的 THINKTIN_AI_CODEMAGIC_API_KEY（docs/ios-release.md 2.2）。产物（截图、日志）
# 传成 GitHub 的 artifact `codemagic-<工作流>`。免费额度每月 500 分钟：apple-check 约 6 分钟，截图约 20 分钟。
name: Codemagic

on:
  push:
    branches: ["codemagic/**"]
  workflow_dispatch:
    inputs:
      workflow:
        description: codemagic.yaml 里的工作流
        type: choice
        options: [apple-check, ios-screenshots, apple-package]
        default: apple-check

permissions:
  contents: read

# 同一个分支同时只跑一个；新推的取消旧的（旧的 Codemagic 构建由取消步骤一起取消）。
concurrency:
  group: codemagic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codemagic:
    name: Run on Codemagic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "Test flight"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick the Codemagic workflow
        env:
          INPUT_WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            workflow="${GITHUB_REF_NAME#codemagic/}"
          else
            workflow="$INPUT_WORKFLOW"
          fi
          case "$workflow" in
            apple-check|ios-screenshots|apple-package) ;;
            *) echo "::error::分支名要是 codemagic/apple-check、codemagic/ios-screenshots 或 codemagic/apple-package（现在是 ${GITHUB_REF_NAME}）"; exit 1 ;;
          esac
          echo "WORKFLOW=$workflow" >> "$GITHUB_ENV"
          echo "Codemagic 工作流：${workflow}，分支：${GITHUB_REF_NAME}，提交：${GITHUB_SHA}"
      - name: Run on Codemagic
        env:
          THINKTIN_AI_CODEMAGIC_API_KEY: ${{ secrets.THINKTIN_AI_CODEMAGIC_API_KEY }}
          CODEMAGIC_ARTEFACTS_DIR: ${{ runner.temp }}/codemagic
          CODEMAGIC_WAIT_MINUTES: "80"
        run: python tools/apple/codemagic_build.py "$WORKFLOW" "$GITHUB_REF_NAME"
      - name: Cancel the Codemagic build
        if: ${{ cancelled() && env.CODEMAGIC_BUILD_ID != '' }}
        env:
          THINKTIN_AI_CODEMAGIC_API_KEY: ${{ secrets.THINKTIN_AI_CODEMAGIC_API_KEY }}
        run: python tools/apple/codemagic_build.py --cancel "$CODEMAGIC_BUILD_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codemagic-${{ env.WORKFLOW }}
          path: ${{ runner.temp }}/codemagic/
          if-no-files-found: ignore
