# iOS 的 TestFlight 发版（WBS 12.19，说明见 docs/ios-release.md）。
#
# 打 ios-v<版本> 标签（比如 ios-v0.2.0）触发：打全部 Apple 目标的 ThinktinCore（含真机 arm64），xcodegen 生成工程，
# 用 App Store Connect API key 自动签名归档、上传到 App Store Connect（进 TestFlight 的内部测试组）。
# 版本号取标签，构建号是这个工作流的运行序号（只增不减）。也能手动触发（不上传，只验证能归档）。
#
# 要的密钥都放在 GitHub 的 “Test flight” 环境里（Settings → Environments；仓库是公开的，不进代码）：
#   ASC_KEY_ID           App Store Connect API key 的 id
#   ASC_ISSUER_ID        API key 的 issuer id
#   ASC_KEY_P8           .p8 私钥文件的内容（用文本编辑打开、整段复制粘贴；换行丢了也行）
#                        或者 ASC_KEY_P8_BASE64：.p8 文件的 base64（以前的写法，照样认）
#   APPLE_TEAM_ID        可选：开发者团队 id，不配就用 TEAM_ID_DEFAULT（团队 id 不是密钥，签名的 App 里都看得到）
name: iOS release

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: 上传到 App Store Connect（不勾只归档）
        type: boolean
        default: false
      demo:
        description: 演示版：用演示数据、不连服务器（服务器上线前在 TestFlight 上先看界面）
        type: boolean
        default: false
      runner:
        description: 用哪种 Mac（苹果芯片的排不上队时换 Intel 的）
        type: choice
        options: [macos-26, macos-15-intel, macos-15]
        default: macos-26

# 同时只发一个版本，不取消正在上传的。
concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Siting (Shenzhen) 的开发者团队。
  TEAM_ID_DEFAULT: 5BUH46M229

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 150
    environment: "Test flight"
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      # 标签发版永远连服务器；演示版只能手动触发。
      CLIENT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo && 'mock' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version and build number
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#ios-v}"
          else
            # 手动触发：用工程里的版本号。
            version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apps/apple/project.yml | head -n 1)
          fi
          # App Store 只认 1 到 3 段数字的版本号。
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::版本号 '$version' 不对：标签要像 ios-v0.2.0"
            exit 1
          fi
          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          if [[ "$CLIENT" == "mock" ]]; then echo "::notice::演示版：用演示数据，不连服务器"; fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "版本 ${version}，构建号 ${{ github.run_number }}"

      # 和 ios.yml 一样用 Xcode 26.6；别的镜像（换成 Intel 的 Mac 时）上没有就用装着的最新的 Xcode 26。
      - name: Select Xcode
        run: |
          xcode=/Applications/Xcode_26.6.app
          if [[ ! -d "$xcode" ]]; then
            xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [[ -n "$xcode" && -d "$xcode" ]]; then
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version
          uname -m

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 密钥先装、先验：有问题一分钟内就报，不用等 Rust 编完。
      - name: Install the App Store Connect API key
        id: key
        env:
          # 两个 id 不是机密，填在 Environment variables 里也认；私钥只认 secrets。
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          P8_IN_VARS: ${{ vars.ASC_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          # 不用数组：macOS 的 /bin/bash 3.2 在 set -u 下碰到空数组会报错。
          missing=""
          [[ -n "$ASC_KEY_ID" ]] || missing="$missing ASC_KEY_ID"
          [[ -n "$ASC_ISSUER_ID" ]] || missing="$missing ASC_ISSUER_ID"
          [[ -n "$ASC_KEY_P8" || -n "$ASC_KEY_P8_BASE64" ]] || missing="$missing ASC_KEY_P8"
          if [[ -n "$missing" ]]; then
            echo "::error::GitHub 的 Test flight 环境里读不到${missing}：Settings → Environments → Test flight → Environment secrets 里加上（名字要一字不差）"
            if [[ "$P8_IN_VARS" == "true" ]]; then
              echo "::error::ASC_KEY_P8 填在了 Environment variables 里：私钥要放 Environment secrets（变量谁都看得见），挪过去后把变量删掉"
            fi
            exit 1
          fi
          # 从网页上复制时常带上空格、换行：去掉。
          key_id=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          issuer_id=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if ! [[ "$key_id" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::ASC_KEY_ID 不像密钥 ID（应该是 10 位大写字母和数字，现在是 ${#key_id} 个字符）：填团队密钥列表里那一行的“密钥 ID”"
            exit 1
          fi
          if ! [[ "$issuer_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::ASC_ISSUER_ID 不像 Issuer ID（应该是 8-4-4-4-12 位的一串，现在是 ${#issuer_id} 个字符）：填团队密钥页面顶上的 Issuer ID"
            exit 1
          fi
          echo "::add-mask::$key_id"
          echo "::add-mask::$issuer_id"
          {
            echo "KEY_ID=$key_id"
            echo "ISSUER_ID=$issuer_id"
          } >> "$GITHUB_ENV"
          path="$RUNNER_TEMP/AuthKey.p8"
          (
            umask 077
            if [[ -n "$ASC_KEY_P8" ]]; then
              # 粘贴时换行可能丢了或变成空格：去掉首尾两行和所有空白，按 64 个字符一行重排成 PEM。
              body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \t\r\n')
              { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$path"
            else
              printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$path"
            fi
          )
          if ! openssl pkey -in "$path" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 读不出私钥：用文本编辑打开 .p8 文件，全选复制（从 -----BEGIN 到 END-----）再粘贴一次"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Check the API key with App Store Connect
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pyjwt[crypto]==2.10.1'
          python tools/apple/asc_key_check.py "$KEY_ID" "$ISSUER_ID" "${{ steps.key.outputs.path }}" cn.thinktin.Thinktin

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # 打包、上传失败时也留下 Rust 的缓存，重跑不用再编十几分钟。
          cache-on-failure: true
      - name: Install cmake and XcodeGen
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install cmake xcodegen

      # 全部目标（真机 arm64 归档要用；不带 --ci）。
      - name: Build ThinktinCore (all Apple targets)
        run: tools/client-core/build-apple.sh target/apple

      - name: Generate the Xcode project
        working-directory: apps/apple
        run: |
          set -euo pipefail
          xcodegen generate
          # 发 TestFlight / App Store 的包用生产环境的 APNs（project.yml 里是给 Xcode 直装用的 development）。
          plutil -replace aps-environment -string production Thinktin/Thinktin.entitlements
          plutil -p Thinktin/Thinktin.entitlements

      # 归档时不用开发证书签名，只做本地临时签名（"-"，把 entitlements 带进包里）：CI 每次是新机器，自动签名会去申请
      # “这台机器”的开发证书，上一次的私钥不在，苹果就拒绝（“already has an Apple Development signing certificate for
      # this machine”）。正式签名留给导出：用 API key 让苹果在云端拿分发证书签（cloud signing），本机不需要任何证书。
      - name: Archive
        working-directory: apps/apple
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || env.TEAM_ID_DEFAULT }}
        run: |
          set -o pipefail
          fmt=(cat)
          if command -v xcbeautify >/dev/null; then fmt=(xcbeautify --renderer github-actions); fi
          xcodebuild archive \
            -project Thinktin.xcodeproj \
            -scheme Thinktin \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Thinktin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            THINKTIN_CLIENT="$CLIENT" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | "${fmt[@]}"
          # 包里带上的 entitlements（推送、App Group、Time Sensitive）：导出时云端签名照这些来。
          for bundle in "$RUNNER_TEMP"/Thinktin.xcarchive/Products/Applications/*.app \
            "$RUNNER_TEMP"/Thinktin.xcarchive/Products/Applications/*.app/PlugIns/*.appex; do
            echo "== ${bundle##*/}"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p - || true
          done

      # 不上传时也导出一次（destination export），验证云端签名走得通。
      - name: Export and upload
        working-directory: apps/apple
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || env.TEAM_ID_DEFAULT }}
        run: |
          set -o pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          if [[ "$UPLOAD" == "true" ]]; then
            plutil -insert destination -string upload "$options"
          else
            plutil -insert destination -string export "$options"
          fi
          plutil -insert teamID -string "$TEAM_ID" "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert uploadSymbols -bool true "$options"
          # 构建号由这里定（运行序号），不让 App Store Connect 改。
          plutil -insert manageAppVersionAndBuildNumber -bool false "$options"
          # 为 true 时只能发给内部测试员；这里留着外部测试的可能（加到外部测试组要过 Beta 审核）。
          plutil -insert testFlightInternalTestingOnly -bool false "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Thinktin.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.key.outputs.path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey*.p8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
