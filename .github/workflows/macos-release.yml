# macOS App 的发版（WBS 14.9，说明见 docs/macos.md 第 6 节）。
#
# 打 macos-v<版本> 标签（比如 macos-v0.1.0）触发：只打 macOS 切片的 ThinktinCore（arm64 + x86_64），xcodegen 生成工程，
# 用 Developer ID 证书签名归档、导出，交给苹果公证并把公证结果钉进 App，打成 zip；用 Sparkle 的 EdDSA 私钥签更新包、
# 生成 appcast.xml；zip 和 appcast.xml 发到这个标签的 GitHub Release。appcast.xml 还要放到 App 里写的更新源地址
# （SPARKLE_FEED_URL）——那一步在部署环境里做，见文档。
#
# 版本号取标签，构建号是这个工作流的运行序号（只增不减，Sparkle 按它比新旧）。也能手动触发：不发布；没配证书时只做
# 不签名的归档，验证能编。
#
# 要的密钥都放在 GitHub 的 macos-release 环境里（仓库是公开的，不进代码）：
#   APPLE_TEAM_ID                 开发者团队 id（10 位）
#   MACOS_SIGNING_P12_BASE64      “Developer ID Application”证书（带私钥）导出的 .p12 的 base64
#   MACOS_SIGNING_P12_PASSWORD    .p12 的密码
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64   App Store Connect API key（公证用，和 iOS 发版同一把）
#   SPARKLE_ED_PRIVATE_KEY        Sparkle 的 EdDSA 私钥（generate_keys -x 导出的那一行）
# 仓库变量（不是密钥）：
#   SPARKLE_PUBLIC_ED_KEY         对应的公钥，编进 App 的 Info.plist（没有时 App 不启动自动更新）
#   SPARKLE_FEED_URL              可选：更新源地址，不填用 project.yml 里的
#   MACOS_DOWNLOAD_URL_PREFIX     可选：更新包的下载地址前缀，不填用这个 GitHub Release 的下载地址
name: macOS release

on:
  push:
    tags: ["macos-v*"]
  workflow_dispatch:

# 同时只发一个版本，不取消正在公证的。
concurrency:
  group: macos-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Sign, notarize and publish ThinkTin for Mac
    runs-on: macos-26
    timeout-minutes: 150
    environment: macos-release
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version and build number
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#macos-v}"
          else
            version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apps/apple/project.yml | head -n 1)
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::版本号 '$version' 不对：标签要像 macos-v0.1.0"
            exit 1
          fi
          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "版本 ${version}，构建号 ${{ github.run_number }}"

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cmake and XcodeGen
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install cmake xcodegen

      # 只要 macOS 的两个架构（Apple 芯片和 Intel 的 Mac 都能装）。
      - name: Build ThinktinCore (macOS universal)
        run: tools/client-core/build-apple.sh target/apple --macos

      - name: Generate the Xcode project
        working-directory: apps/apple
        run: xcodegen generate

      # 证书导进一个临时钥匙串（放进搜索列表，codesign 和导出都找得到），用完删掉。
      - name: Install the signing certificate and the API key
        id: signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$TEAM_ID" || -z "$P12_BASE64" || -z "$ASC_KEY_ID" || -z "$ASC_KEY_P8_BASE64" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::macos-release 环境里的签名、公证密钥没配齐（见 docs/macos.md 第 6 节）"
              exit 1
            fi
            echo "::warning::没配签名证书：只做不签名的归档"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Archive
        working-directory: apps/apple
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
        run: |
          set -euo pipefail
          fmt=(cat)
          if command -v xcbeautify >/dev/null; then fmt=(xcbeautify --renderer github-actions); fi
          settings=(
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}"
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY"
          )
          if [[ -n "$SPARKLE_FEED_URL" ]]; then settings+=(SPARKLE_FEED_URL="$SPARKLE_FEED_URL"); fi
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            settings+=(
              DEVELOPMENT_TEAM="$TEAM_ID"
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="Developer ID Application"
              OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain }} --timestamp"
            )
          else
            settings+=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild archive \
            -project Thinktin.xcodeproj \
            -scheme ThinktinMac \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/ThinkTin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            "${settings[@]}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | "${fmt[@]}"

      - name: Export with Developer ID
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string developer-id "$options"
          plutil -insert teamID -string "$TEAM_ID" "$options"
          plutil -insert signingStyle -string manual "$options"
          plutil -insert signingCertificate -string "Developer ID Application" "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ThinkTin.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/ThinkTin.app"

      # 公证（苹果查过没有恶意代码），结果钉进 App（离线时 Gatekeeper 也认）。
      - name: Notarize and staple
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/ThinkTin.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "${{ steps.signing.outputs.key }}" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 1h --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [[ "$status" != "Accepted" ]]; then
            id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" \
              --key "${{ steps.signing.outputs.key }}" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              "$RUNNER_TEMP/notary-log.json" || true
            echo "::error::公证没通过（${status}），日志在 notary-log.json"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          version="${{ steps.version.outputs.marketing }}"
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            app="$RUNNER_TEMP/export/ThinkTin.app"
            zip="$RUNNER_TEMP/dist/ThinkTin-$version.zip"
          else
            app="$RUNNER_TEMP/ThinkTin.xcarchive/Products/Applications/ThinkTin.app"
            zip="$RUNNER_TEMP/dist/ThinkTin-$version-unsigned.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/dist"

      # Sparkle 的 appcast：用工程钉死的 Sparkle 包（SwiftPM 按校验和取的）里带的 generate_appcast，私钥写进临时文件、用完删。
      - name: Sign the update and generate appcast.xml
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: ${{ vars.MACOS_DOWNLOAD_URL_PREFIX }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::warning::没配 SPARKLE_ED_PRIVATE_KEY：不生成 appcast.xml，装好的 App 收不到这个版本的自动更新"
            exit 0
          fi
          tool=$(find "$RUNNER_TEMP/DerivedData/SourcePackages/artifacts" -type f -name generate_appcast -perm -u+x | head -n 1)
          [[ -n "$tool" ]] || { echo "::error::找不到 Sparkle 的 generate_appcast"; exit 1; }
          prefix="${DOWNLOAD_URL_PREFIX:-https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/}"
          keyfile="$RUNNER_TEMP/sparkle_ed_key"
          (umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$keyfile")
          # 读 dist 里的更新包，appcast.xml 写在同一个目录。
          "$tool" --ed-key-file "$keyfile" --download-url-prefix "$prefix" "$RUNNER_TEMP/dist"
          rm -f "$keyfile"
          cat "$RUNNER_TEMP/dist/appcast.xml"

      - name: Publish the GitHub release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=("${{ steps.package.outputs.zip }}")
          [[ -f "$RUNNER_TEMP/dist/appcast.xml" ]] && files+=("$RUNNER_TEMP/dist/appcast.xml")
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
            --title "ThinkTin for Mac ${{ steps.version.outputs.marketing }}" \
            --notes "Developer ID 签名、已公证。appcast.xml 要放到 App 的更新源地址上，已安装的 App 才会收到更新（docs/macos.md 第 6 节）。"

      - name: Remove the keychain and keys
        if: always()
        run: |
          if [[ -n "${{ steps.signing.outputs.keychain }}" ]]; then
            security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/sparkle_ed_key" "$RUNNER_TEMP/signing.p12"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release
          path: |
            ${{ runner.temp }}/dist
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/notary.json
            ${{ runner.temp }}/notary-log.json
          if-no-files-found: ignore
