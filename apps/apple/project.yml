# Tokyo internal build. Inherit the complete project from main.
include:
  - project.base.yml
settings:
  base:
    MARKETING_VERSION: "0.1.0"
targets:
  Thinktin:
    settings:
      base:
        THINKTIN_API_BASE_URL: https://api.thinktin.si
        THINKTIN_RELAY_URL: wss://relay.thinktin.si/v1/connect
    info:
      properties:
        ThinktinAPIBaseURL: https://api.thinktin.si
        ThinktinClient: core
        ThinktinRelayURL: wss://relay.thinktin.si/v1/connect
    postBuildScripts:
      - name: Verify Tokyo internal build
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          plist="$SCRIPT_INPUT_FILE_0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ThinktinAPIBaseURL' "$plist")" = 'https://api.thinktin.si'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ThinktinClient' "$plist")" = core
          test "$(/usr/libexec/PlistBuddy -c 'Print :ThinktinRelayURL' "$plist")" = 'wss://relay.thinktin.si/v1/connect'
          echo 'Verified Tokyo API, relay and core client in packaged Info.plist'
