# Thinktin 的 Xcode 工程定义（WBS 12.1，说明见 docs/ios.md 第 2、7 节）。用 XcodeGen 2.46 生成，
# 不提交 .xcodeproj，本机和 CI 都现生成：
#
#   tools/client-core/build-apple.sh target/apple   # 先打 ThinktinCore（ThinktinKit 依赖它）
#   cd apps/apple && xcodegen generate
#
# Info.plist 和 Thinktin.entitlements 也由这里的 info / entitlements 生成（每次 generate 覆盖），
# 要改就改这里，不要改生成的文件。键名对照 https://github.com/yonaskolb/XcodeGen/blob/2.46.0/Docs/ProjectSpec.md
name: Thinktin

options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: cn.thinktin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  # 工程的开发语言和 knownRegions；和 Info.plist 的 CFBundleDevelopmentRegion 一致。
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

# 所有 target 共用：Swift 6 语言模式、严格并发检查、自动签名。DEVELOPMENT_TEAM 留空，
# 本机在 Xcode 里选自己的团队（或 xcodebuild DEVELOPMENT_TEAM=...），CI 不签名。
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # iOS / macOS 共享的 Swift Package（产品 ThinktinKit、ThinktinUI、ThinktinCoreAdapter）。
  ThinktinKit:
    path: ThinktinKit

targets:
  Thinktin:
    type: application
    platform: iOS
    sources:
      - path: Thinktin
    dependencies:
      - package: ThinktinKit
        products:
          - ThinktinUI
          - ThinktinKit
          - ThinktinCoreAdapter
    # 包 id 由 bundleIdPrefix 生成（cn.thinktin.Thinktin）；上架前定下来后再显式写 PRODUCT_BUNDLE_IDENTIFIER，
    # 服务端 push.apns.topic 要和它一致。
    settings:
      base:
        # 只做 iPhone（1）；iPad 以后再说。要写在 target 上：XcodeGen 的 iOS 平台预设在 target 一级设成 1,2，
        # 写在工程一级会被它盖掉。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 接口地址，展开进 Info.plist 的 ThinktinAPIBaseURL（AppEnvironment 读）。连测试环境时
        # xcodebuild THINKTIN_API_BASE_URL=https://... 覆盖，不用改代码。
        THINKTIN_API_BASE_URL: https://api.thinktin.cn
    info:
      path: Thinktin/Resources/Info.plist
      properties:
        CFBundleDisplayName: ThinkTin
        # XcodeGen 默认写死 1.0 / 1，这里改成跟构建设置走。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 推送带 content-available 时后台拉收件箱、刷新运行状态（12.8）。
        UIBackgroundModes: [remote-notification]
        NSFaceIDUsageDescription: 用面容 ID 确认审批、签名等高风险操作。
        # 深链（docs/ios.md 第 6.1 节，和安卓端同一套）：thinktin://run/{id}、approval/{id}、plan/{id}、instance/{id}、
        # inbox、inbox/{id}、vault/request/{id}。App 的 onOpenURL 交给 Router（ThinktinKit/Navigation，WBS 12.16）解析。
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [thinktin]
        ThinktinAPIBaseURL: $(THINKTIN_API_BASE_URL)
    entitlements:
      path: Thinktin/Thinktin.entitlements
      properties:
        # 开发环境的 APNs；导出 App Store 包时 Xcode 按发布用的描述文件换成 production。
        aps-environment: development

  ThinktinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ThinktinTests
    dependencies:
      # 依赖 App target：XcodeGen 自动设 TEST_HOST / BUNDLE_LOADER，测试跑在 App 进程里。
      - target: Thinktin
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Thinktin:
    build:
      targets:
        Thinktin: all
        ThinktinTests: [test]
    run:
      config: Debug
      environmentVariables:
        # Debug 默认用 Mock 客户端（AppEnvironment）；要连真接口就在 scheme 里勾上这一项（0 = 真核心）。
        - variable: THINKTIN_MOCK
          value: "0"
          isEnabled: false
    test:
      config: Debug
      # App 的单元测试，加上 ThinktinKit 里只能在 Apple 平台跑的界面测试（docs/ios.md 第 7 节）；
      # ThinktinKitTests、ThinktinCoreAdapterTests 在 CI 的 Linux 任务里跑。
      targets:
        - name: ThinktinTests
        - package: ThinktinKit/ThinktinUITests
      environmentVariables:
        # 测试宿主 App 一律用 Mock，不碰网络。
        THINKTIN_MOCK: "1"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
