# Codemagic（https://codemagic.io）上的 Apple 构建：GitHub 的 macOS 机器排不上时的另一个去处（docs/macos.md 第 7 节）。
# 做的事和 .github/workflows/ios.yml 的 app-macos 作业一样：打 ThinktinCore（模拟器 + macOS 的 arm64 切片）、macOS 上编整个
# ThinktinKit、xcodegen 生成工程、iPhone 模拟器上 build + test、编 macOS App（ThinktinMac）、macOS 本机 swift test。
# 后面几步失败了也接着跑（问题一次看全），最后一步按记下的失败报错。
#
# 触发：在 Codemagic 网页上选分支手动开始，或者用 API（POST https://api.codemagic.io/builds，workflowId 是 apple-check）。
# 机器自带 Xcode、Homebrew、Python；Rust 在第一步装。
workflows:
  apple-check:
    name: Apple apps (iOS simulator + macOS)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        CARGO_INCREMENTAL: "0"
        CARGO_TERM_COLOR: always
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
    scripts:
      - name: Tools (Rust, cmake, XcodeGen)
        script: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios-sim aarch64-apple-darwin
          brew install cmake xcodegen
          # 许可证清单工具要 Python 3.11 以上。
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            brew install python@3.12
            echo "PATH=$(brew --prefix python@3.12)/libexec/bin:$PATH" >> "$CM_ENV"
          fi
          rustc --version; xcodegen --version; python3 --version
          mkdir -p "$CM_BUILD_DIR/logs"
      - name: Build ThinktinCore (simulator + macOS arm64)
        script: tools/client-core/build-apple.sh target/apple --ci
      - name: swift build ThinktinKit (macOS, includes ThinktinUI and the tests)
        working_directory: apps/apple/ThinktinKit
        ignore_failure: true
        script: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$CM_BUILD_DIR/logs/swift-build-macos.log" \
            || echo "swift build" >> "$CM_BUILD_DIR/logs/failed"
      - name: Generate the Xcode project
        working_directory: apps/apple
        script: xcodegen generate
      - name: iOS app on the simulator (build + test)
        working_directory: apps/apple
        ignore_failure: true
        script: |
          set -o pipefail
          # 选中的 Xcode 支持的最新 iOS 运行时里第一个可用的 iPhone（和 ios.yml 一样）。
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export SDK_VERSION
          udid=$(xcrun simctl list --json devices available | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          sdk = tuple(int(p) for p in os.environ["SDK_VERSION"].split(".") if p.isdigit())
          def version(runtime):
              return tuple(int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-") if p.isdigit())
          runtimes = sorted(
              (r for r in devices if ".SimRuntime.iOS-" in r and version(r) <= sdk), key=version, reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator")
          ')
          xcodebuild \
            -project Thinktin.xcodeproj \
            -scheme Thinktin \
            -destination "id=$udid" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build test 2>&1 | tee "$CM_BUILD_DIR/logs/xcodebuild-ios.log" \
            || echo "iOS xcodebuild" >> "$CM_BUILD_DIR/logs/failed"
      - name: macOS app (ThinktinMac)
        working_directory: apps/apple
        ignore_failure: true
        script: |
          set -o pipefail
          xcodebuild \
            -project Thinktin.xcodeproj \
            -scheme ThinktinMac \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/logs/xcodebuild-mac.log" \
            || echo "ThinktinMac xcodebuild" >> "$CM_BUILD_DIR/logs/failed"
      - name: swift test ThinktinKit (macOS)
        working_directory: apps/apple/ThinktinKit
        ignore_failure: true
        script: |
          set -o pipefail
          swift test 2>&1 | tee "$CM_BUILD_DIR/logs/swift-test-macos.log" \
            || echo "swift test" >> "$CM_BUILD_DIR/logs/failed"
      - name: Result
        script: |
          if [ -s "$CM_BUILD_DIR/logs/failed" ]; then
            echo "Failed steps:"; cat "$CM_BUILD_DIR/logs/failed"
            exit 1
          fi
          echo "All Apple builds and tests passed."
    artifacts:
      - logs/*.log

  # 完整的 ThinktinCore（真机 arm64、模拟器、macOS 的胖库），和 mobile.yml、ios-release.yml 打的一样：发版前在这里先验。
  apple-package:
    name: ThinktinCore for every Apple target
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        CARGO_INCREMENTAL: "0"
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
    scripts:
      - name: Tools (Rust, cmake)
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          export PATH="$HOME/.cargo/bin:$PATH"
          brew install cmake
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            brew install python@3.12
            echo "PATH=$(brew --prefix python@3.12)/libexec/bin:$PATH" >> "$CM_ENV"
          fi
      - name: Build ThinktinCore (all Apple targets)
        script: |
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/logs"
          tools/client-core/build-apple.sh target/apple 2>&1 | tee "$CM_BUILD_DIR/logs/build-apple.log"
          ls -R target/apple/ThinktinCore/ThinktinCoreFFI.xcframework | head -30
    artifacts:
      - logs/*.log

  # iPhone 模拟器上演示模式的截图（tools/apple/screenshots.sh）：首页、实例、运行、审批、计划、收件箱……，看界面、做上架截图的底稿。
  # 旧系统的回退：发起构建时把环境变量 IOS_RUNTIME 改成 18.6、17.5 这样的版本号（Start new build → Environment variables，
  # 或 API 的 environment.variables）；镜像里没有那个运行时的话脚本先下载。和 .github/workflows/ios-screenshots.yml 的 ios_runtime 一样。
  ios-screenshots:
    name: iOS screenshots (simulator, demo data)
    instance_type: mac_mini_m2
    max_build_duration: 80
    environment:
      xcode: latest
      vars:
        CARGO_INCREMENTAL: "0"
        # IOS_RUNTIME 不在这里写空值：Codemagic 不收空字符串（校验报错，构建起不来）；不设就是最新的运行时。
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
    scripts:
      - name: Tools (Rust, cmake, XcodeGen)
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios-sim aarch64-apple-darwin
          brew install cmake xcodegen
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            brew install python@3.12
            echo "PATH=$(brew --prefix python@3.12)/libexec/bin:$PATH" >> "$CM_ENV"
          fi
      - name: Build ThinktinCore (simulator + macOS arm64)
        script: tools/client-core/build-apple.sh target/apple --ci
      - name: Screenshots
        script: tools/apple/screenshots.sh "$CM_BUILD_DIR/screenshots"
    artifacts:
      - screenshots/*.png

  # TestFlight：GitHub 的 macOS 机器排不上时用。一般从 .github/workflows/ios-release.yml 发起（builder 选 codemagic，
  # tools/apple/codemagic_build.py 发起并跟到结束），做的事和那里的 testflight 作业一样：验密钥 → 打全部 Apple 目标的
  # ThinktinCore → xcodegen → 现建分发证书和两个描述文件 → 手动签名归档 → 导出、上传 → 撤销证书、删描述文件。
  # 苹果的密钥放在 Codemagic 这个 App 的 testflight 变量组里：ASC_KEY_ID、ASC_ISSUER_ID、ASC_KEY_P8（都勾 Secure）。
  # 发起时传的变量：UPLOAD（true 才上传，不传只导出验签名）、CLIENT（mock 是演示版）、THINKTIN_BUILD_NUMBER（构建号，
  # 用 GitHub 工作流的运行序号，和 GitHub 上打的包共用一个只增不减的序号；Codemagic 自己的 BUILD_NUMBER 不用）、
  # THINKTIN_COMMIT（GitHub 那次运行的提交，对不上时提醒）。按 ios-v* 标签构建时版本号取标签，否则取 project.yml。
  ios-testflight:
    name: iOS TestFlight (archive, sign, upload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      groups:
        - testflight
      vars:
        CARGO_INCREMENTAL: "0"
        # Siting (Shenzhen) 的开发者团队（不是密钥，签名的 App 里都看得到）。
        TEAM_ID: 5BUH46M229
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
    scripts:
      - name: Version and build number
        script: |
          set -euo pipefail
          if [[ "${CM_TAG:-}" == ios-v* ]]; then
            version="${CM_TAG#ios-v}"
          else
            version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apps/apple/project.yml | head -n 1)
          fi
          # App Store 只认 1 到 3 段数字的版本号。
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "版本号 '${version}' 不对：标签要像 ios-v0.2.0，不按标签时看 apps/apple/project.yml 的 MARKETING_VERSION"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [[ -n "${THINKTIN_COMMIT:-}" && "$head" != "$THINKTIN_COMMIT" ]]; then
            echo "注意：Codemagic 取到的提交 ${head} 和 GitHub 那次运行的 ${THINKTIN_COMMIT} 不一样（中间又推了新提交），打的是 ${head}"
          fi
          build="${THINKTIN_BUILD_NUMBER:-}"
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then
            echo "没有构建号（THINKTIN_BUILD_NUMBER）：从 GitHub 的 iOS release 工作流发起（builder 选 codemagic），构建号用它的运行序号"
            exit 1
          fi
          mkdir -p "$HOME/thinktin-release" "$CM_BUILD_DIR/logs"
          {
            echo "MARKETING=$version"
            echo "BUILD=$build"
            echo "RUNNER_TEMP=$HOME/thinktin-release"
          } >> "$CM_ENV"
          if [[ "${CLIENT:-}" == "mock" ]]; then echo "演示版：用演示数据，不连服务器"; fi
          echo "版本 ${version}，构建号 ${build}，上传 ${UPLOAD:-false}"
      - name: Tools (Rust, cmake, XcodeGen, Python)
        script: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          brew install cmake xcodegen
          # 许可证清单工具要 Python 3.11 以上；App Store Connect 的脚本要 PyJWT，装在自己的 venv 里（Homebrew 的 Python 不许直接 pip）。
          python=python3
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            brew install python@3.12
            python="$(brew --prefix python@3.12)/libexec/bin/python3"
          fi
          "$python" -m venv "$HOME/asc-venv"
          "$HOME/asc-venv/bin/python" -m pip install --quiet 'pyjwt[crypto]==2.10.1'
          echo "PATH=$HOME/asc-venv/bin:$PATH" >> "$CM_ENV"
          rustc --version; xcodegen --version; "$HOME/asc-venv/bin/python" --version
      - name: Install the App Store Connect API key
        script: tools/apple/asc_install_key.sh
      - name: Check the API key with App Store Connect
        script: python3 tools/apple/asc_key_check.py "$KEY_ID" "$ISSUER_ID" "$RUNNER_TEMP/AuthKey.p8" cn.thinktin.Thinktin
      # 全部目标（真机 arm64 归档要用；不带 --ci）。
      - name: Build ThinktinCore (all Apple targets)
        script: tools/client-core/build-apple.sh target/apple
      - name: Generate the Xcode project
        working_directory: apps/apple
        script: |
          set -euo pipefail
          xcodegen generate
          # 发 TestFlight / App Store 的包用生产环境的 APNs（project.yml 里是给 Xcode 直装用的 development）。
          plutil -replace aps-environment -string production Thinktin/Thinktin.entitlements
          plutil -p Thinktin/Thinktin.entitlements
      # 和 ios-release.yml 一样：每次用 API key 现建一张分发证书（私钥只在这台机器的临时钥匙串里）和两个 App Store 描述文件，
      # 手动签名；跑完在 publishing 的脚本里撤销、删掉（构建失败也会跑）。
      - name: Signing certificate and profiles
        script: |
          set -euo pipefail
          out="$RUNNER_TEMP/signing"
          destination=export
          if [[ "${UPLOAD:-false}" == "true" ]]; then destination=upload; fi
          python3 tools/apple/asc_signing.py setup "$KEY_ID" "$ISSUER_ID" "$RUNNER_TEMP/AuthKey.p8" "$out" \
            "run ${BUILD} codemagic" "$TEAM_ID" "$destination" cn.thinktin.Thinktin cn.thinktin.Thinktin.Widgets
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # 苹果的中间证书（WWDR G3），镜像里一般有，没有时签名找不到完整的证书链。
          if curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; then
            security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" || true
          fi
          security import "$out/signing.p12" -k "$keychain" -P "$(cat "$out/p12-password")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$out"/*.mobileprovision "$dir"/
          done
      - name: Archive
        working_directory: apps/apple
        script: |
          set -o pipefail
          log="$CM_BUILD_DIR/logs/archive.log"
          if ! xcodebuild archive \
            -project Thinktin.xcodeproj \
            -scheme Thinktin \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Thinktin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            -xcconfig "$RUNNER_TEMP/signing/signing.xcconfig" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            THINKTIN_CLIENT="${CLIENT:-}" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            > "$log" 2>&1; then
            # 完整日志在产物 logs/archive.log；这里把出错的行放在最后，远程跟踪时只看日志末尾也能看到。
            tail -n 40 "$log"
            echo "== 出错的行"
            grep -E 'error:|\*\* ARCHIVE FAILED' "$log" | head -n 40
            exit 1
          fi
          tail -n 5 "$log"
          # 包里带上的 entitlements（推送、App Group、Time Sensitive）：出问题时对照描述文件看。
          for bundle in "$RUNNER_TEMP"/Thinktin.xcarchive/Products/Applications/*.app \
            "$RUNNER_TEMP"/Thinktin.xcarchive/Products/Applications/*.app/PlugIns/*.appex; do
            echo "== ${bundle##*/}"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p - || true
          done
      # 不上传时也导出一次（destination export），验证签名走得通。导出选项由 asc_signing.py 生成（手动签名、两个描述文件）。
      - name: Export and upload
        working_directory: apps/apple
        script: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Thinktin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$CM_BUILD_DIR/logs/export.log"
    artifacts:
      - logs/*.log
    publishing:
      scripts:
        # 撤销这次的分发证书、删掉描述文件、临时钥匙串和私钥（构建失败也会跑；被取消、超时的不跑，留下的描述文件和它挂的
        # 证书由下一次 asc_signing.py setup 先清掉）。
        - name: Revoke the signing certificate
          script: |
            if [[ -z "${RUNNER_TEMP:-}" ]]; then exit 0; fi
            if [[ -f "$RUNNER_TEMP/signing/state.json" ]]; then
              python3 tools/apple/asc_signing.py cleanup "$KEY_ID" "$ISSUER_ID" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing" || true
            fi
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/signing"
            rm -f "$RUNNER_TEMP"/AuthKey*.p8
