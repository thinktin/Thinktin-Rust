# Read-only status check for the Tokyo release. Start manually on this branch.
workflows:
  ios-testflight-status:
    name: Check ThinkTin TestFlight build 42
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      groups:
        - testflight
    scripts:
      - name: Read build 42 from App Store Connect
        script: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          export RUNNER_TEMP="$work"
          export CM_ENV="$work/environment"
          bash tools/apple/asc_install_key.sh
          . "$CM_ENV"
          export KEY_ID ISSUER_ID
          python3 -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --quiet 'pyjwt[crypto]==2.10.1'
          PYTHONPATH=tools/apple "$work/venv/bin/python" -u - <<'PY' | tee testflight-status.jsonl
          import json, os, time
          from asc_signing import Client
          from asc_testflight import app_id

          client = Client(os.environ['KEY_ID'], os.environ['ISSUER_ID'], os.path.join(os.environ['RUNNER_TEMP'], 'AuthKey.p8'))
          def get(path):
              status, body = client.call('GET', path)
              if status != 200:
                  raise RuntimeError(f'Apple returned HTTP {status} for {path.split("?")[0]}')
              return body['data']

          app = app_id(client, 'cn.thinktin.Thinktin')
          for attempt in range(8):
              candidates = get(f'/v1/builds?filter[app]={app}&filter[version]=42&limit=20')
              for build in candidates:
                  bid = build['id']
                  version = get(f'/v1/builds/{bid}/preReleaseVersion')['attributes']
                  if version['version'] != '0.1.0' or version['platform'] != 'IOS':
                      continue
                  attrs = build['attributes']
                  beta = get(f'/v1/builds/{bid}/buildBetaDetail')['attributes']
                  groups = get(f'/v1/builds/{bid}/betaGroups?limit=200')
                  internal = [g['attributes']['name'] for g in groups if g['attributes'].get('isInternalGroup')]
                  print(json.dumps(dict(app=app, build=bid, number=attrs['version'], version=version['version'], processing=attrs['processingState'], internalState=beta.get('internalBuildState'), internalGroups=internal, expired=attrs['expired']), ensure_ascii=False))
                  if attrs['processingState'] in ('FAILED', 'INVALID') or attrs['expired']:
                      raise SystemExit('Apple reported an unusable build')
                  if attrs['processingState'] == 'VALID' and internal:
                      raise SystemExit(0)
              if attempt < 7:
                  time.sleep(30)
          raise SystemExit('No completed build with confirmed internal group membership after polling')
          PY
    artifacts:
      - testflight-status.jsonl
