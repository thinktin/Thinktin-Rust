# Hermes Agent（Nous Research）：自带 ACP 入口 hermes-acp（pip 包 hermes-agent[acp,mcp]；没有 mcp extra 时会话注入的 MCP 服务器被静默忽略）。

[agent]
id = "hermes"
name = "Hermes Agent"
upstream = "https://github.com/NousResearch/hermes-agent"
version = "0.19.0"
license = "MIT"
description = { zh-CN = "Nous Research 的 Hermes Agent，会积累技能和记忆的通用 agent。", en = "Hermes Agent from Nous Research, a general-purpose agent that builds up skills and memory." }
sites = ["cn", "global"]

[runtime]
template = "agents/hermes:0.19.0"
vcpu = 1
memory_mb = 2048
state_dirs = [".hermes"]

[[harness]]
id = "acp"
kind = "acp"
command = ["hermes-acp"]
session = { restore = true, per_session_mcp = true }

[llm]
protocols = ["openai-completions", "anthropic-messages"]
config = "hermes"

[policy]
heartbeat = "platform"

# 模板构建（6.8，deploy/templates）装的包，版本写死；升级时和 agent.version、runtime.template 一起改。
# 要带 mcp 这个 extra，不然平台工具注入会被静默忽略。
[install]
pip = ["hermes-agent[acp,mcp]==0.19.0"]
# 删掉网页界面里的商用字体（16.5，docs/licenses.md）：Collapse、Rules（Blaze Type）和 Mondwest（Pangram Pangram）
# 是付费授权的字体，包里没有授权说明，我们不能再分发。沙箱里只用 ACP 入口，用不到网页界面；
# 界面的 CSS 引用不到这些字体时退回默认字体。assets/ 下是打包工具加了哈希的副本。
prune = [
  "pip:hermes_cli/web_dist/fonts/Collapse-*", "pip:hermes_cli/web_dist/fonts/Rules*", "pip:hermes_cli/web_dist/fonts/Mondwest-*",
  "pip:hermes_cli/web_dist/assets/Collapse-*.woff2", "pip:hermes_cli/web_dist/assets/Rules*.woff2",
  "pip:hermes_cli/web_dist/assets/Mondwest-*.woff2",
]
