# Hermes Agent（Nous Research）：自带 ACP 入口 hermes-acp（pip 包 hermes-agent[acp,mcp]；没有 mcp extra 时会话注入的 MCP 服务器被静默忽略）。

[agent]
id = "hermes"
name = "Hermes Agent"
upstream = "https://github.com/NousResearch/hermes-agent"
version = "0.19.0"
license = "MIT"
sites = ["cn", "global"]

[runtime]
template = "agents/hermes:0.19.0"
vcpu = 1
memory_mb = 2048
state_dirs = [".hermes"]

[[harness]]
id = "acp"
kind = "acp"
command = ["hermes-acp"]
session = { restore = true, per_session_mcp = true }

[llm]
protocols = ["openai-completions", "anthropic-messages"]
config = "hermes"

[policy]
heartbeat = "platform"

# 模板构建（6.8，deploy/templates）装的包，版本写死；升级时和 agent.version、runtime.template 一起改。
# 要带 mcp 这个 extra，不然平台工具注入会被静默忽略。
[install]
pip = ["hermes-agent[acp,mcp]==0.19.0"]
