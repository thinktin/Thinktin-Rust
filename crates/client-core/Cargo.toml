[package]
name = "client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# lib：Rust 里测试和复用；staticlib：iOS / macOS 的 xcframework；cdylib：Android 的 .so，也供绑定生成读取元数据。
crate-type = ["lib", "staticlib", "cdylib"]
name = "client_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# 生成 Swift / Kotlin 绑定的命令行（只在打包脚本里用）。
bindgen = ["uniffi/cli"]

[dependencies]
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
p256.workspace = true
proto = { path = "../proto" }
reqwest.workspace = true
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# 和 reqwest 用的是同一份（Android 上初始化存在它的全局变量里）。
rustls-platform-verifier = "0.7.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
uniffi = { version = "0.32.2", features = ["tokio"] }
url.workspace = true
uuid.workspace = true

# Android 上系统证书校验要经 JNI 初始化（`tls.rs`）。
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }

[dev-dependencies]
auth = { path = "../auth" }
axum.workspace = true
control = { path = "../control" }
gateway = { path = "../gateway" }
keyvault = { path = "../keyvault" }
store = { path = "../store", features = ["testing"] }
tempfile.workspace = true
# tests/tls.rs 的 wss 服务端。
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
zeroize.workspace = true
