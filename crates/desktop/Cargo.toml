[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# lib：Rust 里测试和复用；staticlib：macOS App（和 client-core 打进同一个库）；cdylib：绑定生成读取元数据。
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
client-core = { path = "../client-core" }
futures-util.workspace = true
getrandom.workspace = true
# 截图编成 JPEG（纯 Rust，只有编码器）。
jpeg-encoder = "0.6.1"
p256.workspace = true
proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
uniffi = { version = "0.32.2", features = ["tokio"] }
uuid.workspace = true

# Windows 的系统工具（`windows.rs`）：截图、键鼠、打开、回收站。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

# 端到端测试（tests/desktop.rs）要起中继和平台，它们依赖只在 Linux / macOS 上能编的沙箱；Windows 上只跑单元测试。
[target.'cfg(not(windows))'.dev-dependencies]
auth = { path = "../auth" }
orchestrator = { path = "../orchestrator" }
relay = { path = "../relay" }
store = { path = "../store", features = ["testing"] }
