[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# lib：Rust 里测试和复用；staticlib：macOS App（和 client-core 打进同一个库）；cdylib：绑定生成读取元数据。
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
client-core = { path = "../client-core" }
futures-util.workspace = true
getrandom.workspace = true
p256.workspace = true
proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
uniffi = { version = "0.32.2", features = ["tokio"] }
uuid.workspace = true

[dev-dependencies]
auth = { path = "../auth" }
orchestrator = { path = "../orchestrator" }
relay = { path = "../relay" }
store = { path = "../store", features = ["testing"] }
tempfile.workspace = true
