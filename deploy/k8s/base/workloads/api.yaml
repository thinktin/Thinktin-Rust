# 控制面的接口副本：客户端接口（REST、事件流），不跑后台任务。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinktin-api
  labels:
    app.kubernetes.io/name: thinktin-api
    app.kubernetes.io/part-of: thinktin
    track: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # 新副本就绪了才停旧的；新副本因为迁移没执行起不来时，发布停在这里，旧副本照常服务。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: thinktin-api
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thinktin-api
        app.kubernetes.io/part-of: thinktin
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # 停机：先报未就绪 5 秒（drain_secs）让负载均衡摘掉，再等进行中的请求最多 30 秒（grace_secs）。
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: thinktin-server
          args: ["serve"]
          env:
            - name: THINKTIN_CONFIG
              value: /etc/thinktin/config/server.toml
            - name: THINKTIN_API_ENABLED
              value: "true"
            - name: THINKTIN_WORKER_ENABLED
              value: "false"
            - name: THINKTIN_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # DATABASE_URL、THINKTIN_ACCESS_TOKEN_SEED、THINKTIN_CODE_PEPPER、KMS、对象存储、短信的密钥。
          envFrom:
            - secretRef:
                name: thinktin-api
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/thinktin/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: thinktin-server
        - name: tmp
          emptyDir: {}
