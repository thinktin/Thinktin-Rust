# 设备中继：电脑主动连上来的长连接（wss），转发电脑工具的调用和手机、电脑之间的消息。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinktin-relay
  labels:
    app.kubernetes.io/name: thinktin-relay
    app.kubernetes.io/part-of: thinktin
    track: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # 停机的副本让电脑重连到别的副本（关闭码 1012），一个一个换。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: thinktin-relay
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thinktin-relay
        app.kubernetes.io/part-of: thinktin
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: thinktin-relay
          args:
            - --metrics-listen=0.0.0.0:9090
            - --log-json
          env:
            - name: THINKTIN_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            # THINKTIN_ACCESS_TOKEN_KEYS：控制面签访问令牌的公钥（`thinktin-server check-config` 打印）。
            - configMapRef:
                name: thinktin-relay
            # DATABASE_URL（thinktin_relay 角色的登录账号）。
            - secretRef:
                name: thinktin-relay
          ports:
            - name: http
              containerPort: 8792
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
