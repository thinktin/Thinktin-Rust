# 控制面的后台副本：调度、执行器、推送投递、实例巡检、数据维护。不对外。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinktin-worker
  labels:
    app.kubernetes.io/name: thinktin-worker
    app.kubernetes.io/part-of: thinktin
    track: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # 停机的副本马上交回手里的运行，新副本接着跑（7.15 演练过），所以一个一个换就行。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: thinktin-worker
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thinktin-worker
        app.kubernetes.io/part-of: thinktin
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: thinktin-server
          args: ["serve"]
          env:
            - name: THINKTIN_CONFIG
              value: /etc/thinktin/config/server.toml
            - name: THINKTIN_API_ENABLED
              value: "false"
            - name: THINKTIN_WORKER_ENABLED
              value: "true"
            - name: THINKTIN_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # DATABASE_URL、THINKTIN_SANDBOX_TOKEN_SEED、KMS、对象存储、CubeAPI、极光推送的密钥。
          envFrom:
            - secretRef:
                name: thinktin-worker
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/thinktin/config
              readOnly: true
            # APNs 私钥（apns.p8）、FCM 服务账号（fcm.json），配置里的 key_path、service_account_path 指到这里。
            - name: push
              mountPath: /etc/thinktin/push
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: thinktin-server
        - name: push
          secret:
            secretName: thinktin-push
            optional: true
        - name: tmp
          emptyDir: {}
