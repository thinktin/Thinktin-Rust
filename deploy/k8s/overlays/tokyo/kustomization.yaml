# 东京 10 人测试环境（docs/deploy-aliyun-sg.md 第 8.9 节）：一台 ECS 上的 k3s 单机，每个服务一个副本；
# agent 沙箱在同一个 VPC 的 ACS 集群里（docs/sandbox-acs.md）。在服务机上怎么部署见 deploy/aliyun/machine/README.md。
# 镜像版本由发布包固定（../../bundle.sh tokyo …），见 overlays/production。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thinktin
resources:
  - ../../base
configMapGenerator:
  - name: thinktin-server
    files:
      - server.toml
  # 模型网关、中继要的两个公钥（ConfigMap thinktin-llm-gw 的 THINKTIN_SANDBOX_TOKEN_KEY、thinktin-relay 的
  # THINKTIN_ACCESS_TOKEN_KEYS）不在这里：密钥在服务机上生成，公钥由 deploy/aliyun/machine/05-secrets.sh 和 Secret 一起
  # 直接建进集群，不提交、也不用回填。部署包里没有这两个 ConfigMap，重新 apply 不会把它们改回占位值。
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      # 镜像是在服务机上构建、导进 k3s 的（thinktin.local/tokyo/…，没有这个仓库）：只用本地的，不去拉。
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      # 服务机是 2 核的经济型，CPU 被别的事占着时（构建镜像、迁移）探针默认的 1 秒超时容易误判，放宽一点。
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 3
      # 配置和密钥的指纹：deploy/aliyun/machine/06-deploy.sh 部署时换成 ConfigMap、Secret 现在的版本算出来的值，
      # 它们变了 Pod 才跟着重启（envFrom 和挂载的配置不会自己生效）。这里的占位值不用改。
      - op: add
        path: /spec/template/metadata/annotations/thinktin.si~1config-stamp
        value: unset
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  # 对外入口：服务机上的 Caddy 终止 TLS，api.thinktin.si、relay.thinktin.si 分别转到这两个 Service。地址固定下来
  # （k3s 的服务网段 10.43.0.0/16 里留给手动指定的那一段），Caddyfile 里写死它：删了命名空间重建也不变，
  # 也不用多开 NodePort。和 deploy/aliyun/machine/common.sh 里的 API_SERVICE_IP、RELAY_SERVICE_IP 一致。
  - target:
      kind: Service
      name: thinktin-api
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.0.80
  - target:
      kind: Service
      name: thinktin-relay
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.0.81
  # 沙箱令牌绑定沙箱的 Pod IP，模型网关要直接看到它：用服务机的网络监听 8790（沙箱经 VPC 内网直连
  # 172.16.0.168:8790），前面不能有 NodePort、负载均衡、Caddy 这类会换来源地址的东西。
  # 主密钥是本地的（Secret thinktin-llm-gw 里的 THINKTIN_KMS_KEY），不加 KMS 参数。
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=thinktin-llm-gw
    # 用了主机网络，8790、8791、9090 就是服务机的端口：新旧两个 Pod 不能同时在，升级时先停旧的再起新的
    # （模型网关断一下，最多等进行中的流式请求 300 秒）。
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirstWithHostNet
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
      # 受控出网通道（2.7）：同一个进程、服务机的 8791。沙箱经 VPC 直连，来源地址就是 Pod IP（令牌绑定它）。
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --egress-listen=0.0.0.0:8791
      # 服务机自己的公网地址（买机器时自动分的，机器在就不变；换成 EIP 或加了负载均衡要跟着改）。它在解析检查里算公网，
      # 不禁掉沙箱就能经它绕回服务机；一个都不写模型网关启动时报错。还有别的公网地址也加在这里，一个一行。
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --egress-deny=8.216.52.81/32
      # 浏览器通道和 /v1/browser/ask（docs/browser.md 第 4.3 节）。要先于 server.toml 的 [browser] enabled 上线。
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --egress-browser-lanes
  # 工作区归档的密文临时文件放 /tmp（docs/sandbox-acs.md）：同时存、放各一份最大的归档（temp_budget_bytes 默认 9 GiB）。
  # 服务机只有 40G 系统盘。2026-10-28 定：测试阶段保持默认（max_bytes 4 GiB）。以后要省盘就在 server.toml 里把
  # max_bytes、temp_budget_bytes 一起调小（已经存下的大归档要两边加起来放得下才放得回来，见 docs/sandbox-acs.md 第 6 节）。
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=thinktin-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/2
        value:
          name: tmp
          emptyDir:
            sizeLimit: 10Gi
