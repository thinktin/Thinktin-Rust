path = "pcre2-LICENCE.md"
url = "https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.46/LICENCE.md"

[[file]]
component = "musl"
version = "1.2.5"
license = "MIT"
path = "musl-COPYRIGHT"
url = "https://git.musl-libc.org/cgit/musl/plain/COPYRIGHT?h=v1.2.5"

