# 语音运行时（GStreamer 1.28.6、GLib 2.88.3、libffi、PCRE2 10.47、zlib、opus、proxy-libintl）：
# 包里自带 NOTICE.md 和 licenses/，在 node_modules 深处，扫描只看包的根目录，这里指过去。
[[installed]]
component = "codex-voice-runtime"
version = "0.160.1"
license = "LGPL-2.1-only AND LGPL-2.0-only AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Zlib"
glob = "/usr/local/lib/node_modules/**/codex-resources/voice/NOTICE.md"

[[installed]]
component = "codex-voice-runtime"
version = "0.160.1"
license = "LGPL-2.1-only AND LGPL-2.0-only AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Zlib"
glob = "/usr/local/lib/node_modules/**/codex-resources/voice/licenses/*"

# Codex 自己的 Rust 程序依赖的 crate：deploy/templates/build.sh 构建前从这个标签的源码生成（licenses.py upstream-cargo）。
# 包名和平台按 openai/codex 在这个标签下的打包脚本：codex、code-mode-host、bwrap 是 musl 静态链接，语音进程是 glibc。
[[cargo]]
repo = "https://github.com/openai/codex"
tag = "rust-v0.160.1"
manifest = "codex-rs/Cargo.toml"
packages = ["codex-cli", "codex-code-mode-host", "codex-bwrap"]
target = "x86_64-unknown-linux-musl"

[[cargo]]
repo = "https://github.com/openai/codex"
tag = "rust-v0.160.1"
manifest = "codex-rs/Cargo.toml"
packages = ["codex-voice-host"]
target = "x86_64-unknown-linux-gnu"
