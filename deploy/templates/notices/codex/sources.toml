# Codex 模板要额外带的原文（16.5，docs/licenses.md 第 3 节）。
#
# Codex 是 Apache-2.0，但 @openai/codex 和它的平台包（@openai/codex@<版本>-linux-x64）里没有 LICENSE、NOTICE，
# 也没有第三方许可清单。平台包里的程序静态链接了不少第三方代码：
# - bin/codex、codex-code-mode-host：Rust crate（清单由下面的 [[cargo]] 生成）、OpenSSL、AWS-LC、musl；
#   code-mode-host 里还有 V8；
# - codex-resources/bwrap：bubblewrap（LGPL-2.0-or-later）+ libcap（BSD-3-Clause OR GPL-2.0-only）；
# - codex-path/rg：ripgrep（Unlicense OR MIT）+ PCRE2；
# - codex-resources/zsh：改过的 zsh（加了 EXEC_WRAPPER，补丁见
#   https://raw.githubusercontent.com/openai/codex/rust-v0.160.1/codex-rs/shell-escalation/patches/zsh-exec-wrapper.patch）；
# - codex-resources/voice：GStreamer、GLib 等动态库，它们的原文包里自带（下面的 [[installed]]）。
# 以上从上游取，URL 钉在标签或提交上。
#
# 2026-10-20 按 codex-acp 2.2.2 → @openai/codex 0.160.1（标签 rust-v0.160.1，提交 d27764b8）核对：
# 各组件的版本来自二进制里的字符串和 openai/codex 在这个标签下的构建脚本（.github/scripts/）。
# 升级后 applies_to 对不上，CI 会报错，要重新核对（版本号都要换）。

applies_to = ["npm:@openai/codex@0.160.1-linux-x64"]

[[file]]
component = "openai-codex"
version = "0.160.1"
license = "Apache-2.0"
path = "codex-LICENSE"
url = "https://raw.githubusercontent.com/openai/codex/rust-v0.160.1/LICENSE"

[[file]]
component = "openai-codex"
version = "0.160.1"
license = "Apache-2.0"
path = "codex-NOTICE"
url = "https://raw.githubusercontent.com/openai/codex/rust-v0.160.1/NOTICE"

[[file]]
component = "openai-codex"
version = "0.160.1"
license = "Apache-2.0"
path = "wezterm-LICENSE"
url = "https://raw.githubusercontent.com/openai/codex/rust-v0.160.1/third_party/wezterm/LICENSE"

[[file]]
component = "bubblewrap"
version = "0.11.2"
license = "LGPL-2.0-or-later"
path = "bubblewrap-COPYING"
url = "https://raw.githubusercontent.com/openai/codex/rust-v0.160.1/codex-rs/vendor/bubblewrap/COPYING"

[[file]]
component = "libcap"
version = "2.75"
license = "BSD-3-Clause OR GPL-2.0-only"
path = "libcap-License"
url = "https://git.kernel.org/pub/scm/libs/libcap/libcap.git/plain/License?h=libcap-2.75"

[[file]]
component = "zsh"
version = "77045ef899e53b9598bebc5a41db93a548a40ca6"
license = "LicenseRef-Zsh"
path = "zsh-LICENCE"
url = "https://raw.githubusercontent.com/zsh-users/zsh/77045ef899e53b9598bebc5a41db93a548a40ca6/LICENCE"

[[file]]
component = "ripgrep"
version = "15.2.0"
license = "Unlicense OR MIT"
path = "ripgrep-COPYING"
url = "https://raw.githubusercontent.com/BurntSushi/ripgrep/15.2.0/COPYING"

[[file]]
component = "ripgrep"
version = "15.2.0"
license = "Unlicense OR MIT"
path = "ripgrep-LICENSE-MIT"
url = "https://raw.githubusercontent.com/BurntSushi/ripgrep/15.2.0/LICENSE-MIT"

[[file]]
component = "ripgrep"
version = "15.2.0"
license = "Unlicense OR MIT"
path = "ripgrep-UNLICENSE"
url = "https://raw.githubusercontent.com/BurntSushi/ripgrep/15.2.0/UNLICENSE"

[[file]]
