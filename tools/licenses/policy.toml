# 许可证策略（WBS 16.5，说明见 docs/licenses.md）。tools/licenses/licenses.py check 按这里检查清单。
#
# 判定：SPDX 表达式里 OR 取对我们最有利的一支（多许可证的包我们选能用的那个），AND 取最严的。
# 每个许可证落在三类之一：
# - allow：放行。宽松许可证，和只管改动过的文件的弱 copyleft（MPL、EPL、CDDL）。
# - deny：直接报错。网络 copyleft（用户经网络使用就要向用户公开源码：AGPL、SSPL、OSL、EUPL、RPL、CPAL），
#   和限制商用、托管的“源码可见”许可证（BUSL、Elastic、PolyForm、FSL、Commons Clause、CC 的非商用条款）。
# - 其他（GPL、专有、没有许可证、认不出来）：在下面 [[exception]] 逐个登记、写明理由才放行，否则报错。
#   登记按“生态 + 包名 + 版本 + 许可证”匹配：上游换了许可证，登记就对不上，CI 报错，要人重新看。
#
# 名字可以用通配符（* ?），不分大小写。

allow = [
  # 宽松
  "MIT", "MIT-0", "X11", "Apache-2.0", "Apache-1.1", "BSD-1-Clause", "BSD-2-Clause", "BSD-2-Clause-Patent", "BSD-3-Clause",
  "BSD-3-Clause-Clear", "LicenseRef-BSD-Unspecified", "ISC", "0BSD", "Zlib", "zlib-acknowledgement", "BSL-1.0",
  "Unlicense", "CC0-1.0", "LicenseRef-Public-Domain", "WTFPL", "BlueOak-1.0.0", "Python-2.0", "Python-2.0.1",
  "PSF-2.0", "HPND", "MIT-CMU", "UPL-1.0", "NCSA", "PostgreSQL", "curl", "OpenSSL", "ICU", "Unicode-3.0", "Unicode-DFS-2015",
  "Unicode-DFS-2016", "CDLA-Permissive-2.0", "Artistic-2.0", "ZPL-2.1", "AFL-2.1", "AFL-3.0", "MS-PL", "W3C",
  "W3C-20150513", "bzip2-1.0.6", "libpng-2.0", "IJG", "Info-ZIP", "MulanPSL-2.0", "ECL-2.0",
  # 文档、数据、字体（随包带的图标、文档）
  "CC-BY-3.0", "CC-BY-4.0", "OFL-1.1",
  # 弱 copyleft：只要求改过的文件（MPL、EPL、CDDL）或库本身（LGPL）开源；我们不改上游代码。
  "MPL-2.0", "MPL-1.1", "EPL-1.0", "EPL-2.0", "CDDL-1.0", "CDDL-1.1",
  "LGPL-2.0-only", "LGPL-2.0-or-later", "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
  "LGPL-2.1", "LGPL-2.1+", "LGPL-3.0", "LGPL-3.0+", "LicenseRef-LGPL-Unspecified",
]

# `A WITH 例外`：下面这些例外只是额外放宽（允许链接、允许不带源码分发运行时之类），按 A 判定；
# 别的例外要人看；在 deny 里的（比如 Commons-Clause 这种附加限制）直接禁止。
allow_exceptions = [
  "LLVM-exception", "Classpath-exception-2.0", "GCC-exception-2.0", "GCC-exception-3.1", "PCRE2-exception",
  "OpenSSL-exception", "Autoconf-exception-*", "Bison-exception-*", "Libtool-exception", "Font-exception-2.0",
  "Swift-exception", "Linux-syscall-note", "LZMA-exception", "Universal-FOSS-exception-1.0",
  "WxWindows-exception-3.1", "Qt-LGPL-exception-1.1", "Qt-GPL-exception-1.0",
]

deny = [
  "AGPL-*", "LicenseRef-AGPL-*", "SSPL-*", "OSL-*", "EUPL-*", "RPL-*", "CPAL-*",
  "BUSL-*", "Elastic-*", "PolyForm-*", "FSL-*", "Commons-Clause", "LicenseRef-Commons-Clause",
  "CC-BY-NC-*", "LicenseRef-NonCommercial",
]

# Rust 的依赖静态链接进我们的程序：LGPL 要求用户能换掉库重新链接，静态链接做不到，所以要单独看。
[ecosystem.cargo]
review = ["LGPL-*", "LicenseRef-LGPL-*"]

# Debian main 的包都是自由软件（DFSG），copyright 文件里一个包常列好几个许可证（测试文件、文档各不相同），
# 不逐个判定，只拦禁止名单里的。
[ecosystem.deb]
mode = "deny-only"

# ---------------------------------------------------------------------------
# 每个 agent：清单 agent.license（App 的 agent 目录里显示的）以哪个包为准。
# license_of = "<生态>:<包名>"。检查时这个包的许可证（登记过的例外用它的 as）要和 agent.license 一样。

[agents.claude]
license_of = "npm:@anthropic-ai/claude-agent-sdk"

[agents.codex]
license_of = "npm:@agentclientprotocol/codex-acp"

[agents.pi]
license_of = "npm:@earendil-works/pi-coding-agent"

[agents.openclaw]
license_of = "npm:openclaw"

[agents.hermes]
license_of = "pypi:hermes-agent"

# ---------------------------------------------------------------------------
# 登记的例外。字段：ecosystem、name、version（可省，默认任何版本）、license（扫描出来的许可证；
# 认不出时是包里声明的原文，比如 "SEE LICENSE IN README.md"）、text_sha256（可省：原文的 SHA-256，列表的话
# 包里的原文（包括子目录里的）要正好是这几份，哪份改了、多了登记就失效，专有组件都写上）、restricted_terms（可省：
# 复核过的限制性说法；包里的原文有别的限制性说法照样报）、as（可省：给这个许可证起的名字，清单
# agent.license 用它）、reason（为什么能用、谁确认的）、agents（可省：只对这些 agent 的镜像有效，别的 agent
# 带上同一个组件要另外审查；在这些 agent 的镜像里找不到这一条也报错，防止上游换了包名后登记悄悄失效）。

# Claude Agent SDK 和它带的 Claude Code 二进制（按平台分包，sdk-linux-x64 等）：Anthropic 专有。
# LICENSE.md 全文：“© Anthropic PBC. All rights reserved. Use is subject to the Legal Agreements outlined here:
# https://code.claude.com/docs/en/legal-and-compliance.”
# 那个页面允许在托管沙箱里运行 Claude Code，条件（2026-10-20 核对，docs/agent-integration.md 2.1、docs/licenses.md）：
# 接受 Anthropic 商业条款；二进制不改，不去掉、不限制它自带的登录方式（Claude 账号、用户自己的 API key）；
# 平台不代付、不转售、不居间 Claude 用量，每个用户用自己的凭证。上线前法务复核（16.5 人的部分）。
# 声明指向 README.md，法律条款在 LICENSE.md：两份都钉住，哪份改了都要重新看。
[[exception]]
ecosystem = "npm"
name = "@anthropic-ai/claude-agent-sdk"
license = "SEE LICENSE IN README.md"
text_sha256 = [
  "8ce94b9478bb9868f9641f818e06cd722fbe55d4c22e2d2ed11971b20146173a", # LICENSE.md
  "786e57ced73510c752e2e15901d290c7c22786e4791d8a2e2d96991a9a97c192", # README.md
]
as = "LicenseRef-Anthropic-Commercial"
reason = "Anthropic 专有，按 legal-and-compliance 页面的条件在托管沙箱里运行（法务复核前不上线）"
agents = ["claude"]

[[exception]]
ecosystem = "npm"
name = "@anthropic-ai/claude-agent-sdk-linux-*"
license = "SEE LICENSE IN LICENSE.md"
text_sha256 = ["8ce94b9478bb9868f9641f818e06cd722fbe55d4c22e2d2ed11971b20146173a"] # LICENSE.md
as = "LicenseRef-Anthropic-Commercial"
reason = "Claude Code 二进制本体，同上；里面静态链接的第三方组件的原文见 deploy/templates/notices/claude"
agents = ["claude"]

# Codex 的 Rust 依赖 lzma-sys 带着 xz 5.2 的整个源码树，里面有 LGPL-2.1、GPL 的原文（检查时和声明对不上）。
# 2026-10-21 按 0.1.20 核对：build.rs 只编 xz-5.2/src/liblzma 和 src/common/tuklib_*.c，按 xz 的 COPYING 都是公有领域；
# LGPL 的 getopt、GPL 的脚本和构建文件不编进去。版本写死：升级后 build.rs 编的文件可能变，要重新看。
[[exception]]
ecosystem = "cargo"
name = "lzma-sys"
version = "0.1.20"
license = "MIT OR Apache-2.0"
reason = "编进去的只有 liblzma（公有领域），带着的 LGPL、GPL 原文属于不编的命令行工具和脚本"
agents = ["codex"]

# 下面三个是 Codex 的 Rust 依赖，包里带着的 GPL 原文不是 crate 自己的许可证（2026-10-22 按这些版本核对）。
# zstd-sys 带着 zstd 的源码：zstd 是双许可，每个源文件写着“licensed under both the BSD-style license (LICENSE) and the
# GPLv2 (COPYING). You may select, at your option, one of the above-listed licenses”，我们按 BSD 用。
[[exception]]
ecosystem = "cargo"
name = "zstd-sys"
version = "2.0.16+zstd.1.5.7"
license = "MIT OR Apache-2.0"
reason = "带着的 zstd 是 BSD-3-Clause 或 GPL-2.0 任选（zstd/LICENSE、zstd/COPYING），按 BSD 用"
agents = ["codex"]

# rust-stemmers 的 test_data/ 是 Snowball 的测试词表（GPL-3.0），只在 #[cfg(test)] 的测试里读，不编进程序。
[[exception]]
ecosystem = "cargo"
name = "rust-stemmers"
version = "1.2.0"
license = "MIT OR BSD-3-Clause"
reason = "GPL 的只有测试数据 test_data/，测试才读，不编进去"
agents = ["codex"]

# libdbus-sys 带着 dbus 的源码，只在 vendored 特性打开时编；Codex 的 Cargo.lock 里它只依赖 pkg-config（没有 vendored
# 要的 cc），用的是系统的 libdbus。dbus 本身是 AFL-2.1 或 GPL-2.0-or-later 任选（vendor/dbus/COPYING）。
[[exception]]
ecosystem = "cargo"
name = "libdbus-sys"
version = "0.2.7"
license = "Apache-2.0 OR MIT"
reason = "带着的 dbus 源码不编进去（没开 vendored）；dbus 是 AFL-2.1 或 GPL-2.0-or-later 任选"
agents = ["codex"]

# petgraph 的 assets/images/ 是项目的吉祥物图片 Graphosaurus（CC-BY-SA-4.0，assets/images/LICENSE.md），只给文档和
# 仓库用；src/ 里没有 include_bytes!，不编进程序（2026-10-22 按这个版本核对）。
[[exception]]
ecosystem = "cargo"
name = "petgraph"
version = "0.8.3"
license = "MIT OR Apache-2.0"
reason = "CC-BY-SA-4.0 的只有吉祥物图片 assets/images/，不编进去"
agents = ["codex"]

# Codex 带的 zsh：zsh 自己的宽松许可（保留版权声明和免责的两段即可使用、修改、分发，没有 SPDX 标识）。
# LICENCE 里提到个别 shell 函数是 GPL，Codex 只带了 bin/zsh，没带函数文件。
[[exception]]
ecosystem = "upstream"
name = "zsh"
license = "LicenseRef-Zsh"
reason = "zsh 自己的宽松许可（类似 MIT），原文在 deploy/templates/notices/codex/zsh-LICENCE"
agents = ["codex"]

# ---------------------------------------------------------------------------
# 包里带的字体（检查要求每个字体都登记）。字体常常和包的代码分开授权，有的是商用字体，不能跟着包的许可证算。
# 字段：ecosystem、name（包名）、version（可省）、path（包里的路径，可以是列表，可以用通配符；PyPI 包相对 site-packages）、
# license、reason、agents（可省，同 [[exception]]），原文在哪写一个：license_file（包里的路径，要核对得上 license），
# 或 upstream（deploy/templates/notices/ 里补的组件名）。只按字体家族登记，新加的字体对不上路径就要重新看。

# OpenClaw 网页界面的字体：都是 Google Fonts 上的 OFL 字体，每个家族的 OFL 原文就在旁边（<家族>-OFL.txt）。
[[asset]]
ecosystem = "npm"
name = "openclaw"
path = [
  "dist/control-ui/fonts/atkinson-hyperlegible-next-*.woff2", "dist/control-ui/fonts/dm-sans-*.woff2",
  "dist/control-ui/fonts/fraunces-*.woff2", "dist/control-ui/fonts/geist-*.woff2", "dist/control-ui/fonts/ibm-plex-sans-*.woff2",
  "dist/control-ui/fonts/instrument-sans-*.woff2", "dist/control-ui/fonts/jetbrains-mono-*.woff2",
  "dist/control-ui/fonts/lora-*.woff2", "dist/control-ui/fonts/space-grotesk-*.woff2",
]
license = "OFL-1.1"
license_file = [
  "dist/control-ui/fonts/atkinson-hyperlegible-next-OFL.txt", "dist/control-ui/fonts/dm-sans-OFL.txt",
  "dist/control-ui/fonts/fraunces-OFL.txt", "dist/control-ui/fonts/geist-OFL.txt", "dist/control-ui/fonts/ibm-plex-sans-OFL.txt",
  "dist/control-ui/fonts/instrument-sans-OFL.txt", "dist/control-ui/fonts/jetbrains-mono-OFL.txt",
  "dist/control-ui/fonts/lora-OFL.txt", "dist/control-ui/fonts/space-grotesk-OFL.txt",
]
reason = "OFL-1.1：可以随软件分发，不能单独卖；原文和版权行随字体带着"
agents = ["openclaw"]

# Playwright 的 trace viewer、recorder 用的 VS Code 图标字体。
[[asset]]
ecosystem = "npm"
name = "playwright-core"
path = ["lib/vite/*/codicon*.ttf", "lib/vite/*/assets/codicon*.ttf"]
license = "MIT AND CC-BY-4.0"
upstream = "vscode-codicon"
reason = "VS Code 的 codicon（Playwright 按 VS Code 的 MIT 带；图标出自 vscode-codicons，CC-BY-4.0 要署名），原文见 notices/openclaw"
agents = ["openclaw"]

# Hermes 网页界面终端用的等宽字体。
[[asset]]
ecosystem = "pypi"
name = "hermes-agent"
path = "hermes_cli/web_dist/fonts-terminal/JetBrainsMono-*.woff2"
license = "OFL-1.1"
upstream = "jetbrains-mono"
reason = "JetBrains Mono，OFL-1.1；包里没带原文，从上游补（notices/hermes）"
agents = ["hermes"]
